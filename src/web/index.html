<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>代码审计控制台 · dsh-codesentry</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20 6v5.5c0 4.7-3.3 7.9-8 9.5-4.7-1.6-8-4.8-8-9.5V6z"/><path d="m8.6 11.8 2.3 2.3 4.5-4.6"/></svg>
        </span>
        <div class="brand-txt"><h1>代码审计</h1><p>dsh · console</p></div>
      </div>

      <nav class="nav" id="tabs">
        <button class="tab active" data-tab="tasks" type="button">
          <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg>
          <span class="tab-label">审计任务</span><span class="count" id="count-tasks">0</span>
        </button>
        <button class="tab" data-tab="findings" type="button">
          <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 20 6v5.5c0 4.7-3.3 7.9-8 9.5-4.7-1.6-8-4.8-8-9.5V6z"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg>
          <span class="tab-label">漏洞管理</span><span class="count" id="count-findings">0</span>
        </button>
        <button class="tab" data-tab="prompts" type="button">
          <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h7"/><circle cx="19" cy="16" r="2.2"/></svg>
          <span class="tab-label">审计提示词</span><span class="count" id="count-prompts">0</span>
        </button>
        <button class="tab" data-tab="skills" type="button">
          <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg>
          <span class="tab-label">审计 Skill</span><span class="count" id="count-skills">0</span>
        </button>
        <button class="tab" data-tab="runs" type="button">
          <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4.5h4.5"/><path d="M12 8v4l3 2"/></svg>
          <span class="tab-label">运行记录</span><span class="count" id="count-runs">0</span>
        </button>
        <button class="tab" data-tab="settings" type="button">
          <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
          <span class="tab-label">设置</span>
        </button>
      </nav>

      <div class="side-foot">
        <div class="sys-card" id="sys-card">
          <div class="row"><span class="dot"></span><b><span id="sys-running">0</span> 运行中</b><b id="data-dir" class="dir">加载中…</b></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="page-title">
          <h2 id="page-title">审计任务</h2>
        </div>
        <div class="top-actions" id="top-actions"></div>
      </div>

      <section class="kpis" id="stats"></section>

      <main id="panel" class="panel-host"></main>
    </main>
  </div>

  <div class="overlay hidden" id="overlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script src="./app.js"></script>
</body>
</html>
